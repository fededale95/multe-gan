<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GAN Open C1</title>
<meta name="theme-color" content="#24812f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-maskable-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GAN Open C1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: club band header, score strip, segmented views; one centered column (max 980px) that stacks at phone width. */
:root{
  --bg:#f3f7f1; --surface:#ffffff; --surface-2:#eaf2e7; --ink:#13261a; --muted:#5a6d5f; --line:#d9e4d5;
  --green:#2f9a3a; --green-ink:#1f6e29; --orange:#f08a00; --orange-soft:#fff1dc; --orange-ink:#9a5600;
  --band:#24812f; --band-ink:#ffffff; --danger:#c43c2c; --danger-soft:#fde8e5; --ok-soft:#e1f3df; --on-green:#ffffff;
  --shadow:0 1px 2px rgba(19,38,26,.06),0 4px 16px rgba(19,38,26,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0d1610; --surface:#152119; --surface-2:#1b2b20; --ink:#e7f0e5; --muted:#9bb0a0; --line:#27392d;
  --green:#57c25a; --green-ink:#8be08b; --orange:#ffa53a; --orange-soft:#3a2810; --orange-ink:#ffc47a;
  --band:#17521f; --band-ink:#f2fbef; --danger:#ff7a68; --danger-soft:#3a1814; --ok-soft:#183a1d; --on-green:#07210b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.band{background:var(--band);color:var(--band-ink);border-bottom:5px solid var(--orange);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.band .wrap{display:flex;align-items:center;gap:14px;padding-block:14px}
.logo{width:58px;height:58px;border-radius:50%;background:#fff;padding:2px;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.brand{min-width:0;flex:1}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1;letter-spacing:.01em;text-transform:uppercase}
.brand h1 b{color:var(--orange);font-weight:800}
.brand p{margin:3px 0 0;font-size:13px;opacity:.85;letter-spacing:.06em;text-transform:uppercase}
@media (max-width:480px){.brand p{display:none}.band .wrap{gap:10px}.logo{width:46px;height:46px}.btn-admin{padding:9px}.btn-admin .bl{display:none}.btn-admin svg{width:18px;height:18px}}
.btn-admin{border:1.5px solid rgba(255,255,255,.55);background:transparent;color:var(--band-ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.btn-admin:hover{background:rgba(255,255,255,.12)}
.btn-admin svg{width:16px;height:16px}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;margin-top:2px;overflow-wrap:anywhere}
.stat .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat.paid .v{color:var(--green-ink)} .stat.due .v{color:var(--orange-ink)}
@media (max-width:700px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

.paybox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;padding:14px 16px;border-radius:14px;background:var(--orange-soft);border:1.5px solid var(--orange)}
.paybox .txt{flex:1 1 240px;min-width:0;font-size:14px}
.paybox .txt b{display:block;font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink)}
.paybtn{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#1f1200;text-decoration:none;font-weight:700;border-radius:10px;padding:10px 16px;white-space:nowrap}
.paybtn:hover{filter:brightness(1.05)}
.paybtn svg{width:18px;height:18px}
.paybtn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.pdetail .payrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.turn-hero{background:var(--band);color:var(--band-ink);border-radius:16px;padding:18px 18px 16px;border-bottom:5px solid var(--orange);margin-top:14px}
.turn-hero .k{font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;opacity:.85}
.who{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,44px);line-height:1.05;text-transform:uppercase;margin-top:4px;overflow-wrap:anywhere}
.who .amp{color:var(--orange)}
.who.sm{font-size:28px;color:var(--ink)}
.turn-hero .abs{margin-top:8px;font-size:14px;background:rgba(0,0,0,.18);border-radius:8px;padding:6px 10px;display:inline-block}
.turn-hero .last{margin-top:8px;font-size:13px;opacity:.85}
.turns{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.turn{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.turn .tp{flex:1;min-width:0;font-weight:700;font-size:16px;overflow-wrap:anywhere}
.turn .amp,.afine .amp{color:var(--orange-ink)}
.tn{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--muted);min-width:24px;text-align:center}
.tn.sm{font-size:16px;min-width:20px;display:inline-block}
/* home */
.home{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px}
@media (max-width:760px){.home{grid-template-columns:minmax(0,1fr);gap:10px;margin-top:16px}.home .tile{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:14px 16px}.home .tile .tt{font-size:24px}.home .tile .tl{flex-basis:100%;min-height:0}.home .tile .go{display:none}.home .tile .ic{width:40px;height:40px}}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);border-top:6px solid var(--green);min-width:0;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.tile.sp{border-top-color:var(--orange)}
.tile.cert{border-top-color:var(--danger)}
.tile.cal{border-top-color:var(--band)}
.tile.cal .ic{background:var(--surface-2);color:var(--ink)}
.tile .tmap{display:block;width:100%;margin-top:4px}
.tile .mapbtn.big{display:flex;justify-content:center;align-items:center;width:100%;margin:0;padding:13px 16px;font-size:16px;border-radius:12px;background:var(--orange);color:#1f1200;box-shadow:var(--shadow)}
.tile .mapbtn.big svg{width:20px;height:20px}
.home .tile .tmap{flex-basis:100%}
.tile .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--ok-soft);color:var(--green-ink)}
.tile.sp .ic{background:var(--orange-soft);color:var(--orange-ink)}
.tile.cert .ic{background:var(--danger-soft);color:var(--danger)}
.tile .ic svg{width:26px;height:26px}
.tile .tt{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;text-transform:uppercase}
.tile .tl{font-size:14px;color:var(--muted);min-height:2.6em}
.tile .tl b{color:var(--ink)}
.tile .go{margin-top:auto;font-weight:700;color:var(--green-ink);font-size:14px}
.home-admin{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.btn-back{border:0;background:rgba(255,255,255,.14);color:var(--band-ink);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.btn-back:hover{background:rgba(255,255,255,.24)}
.btn-back svg{width:20px;height:20px}

/* calendar */
.match-hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);border-left:6px solid var(--orange);margin-top:14px}
.match-hero .k{font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}
.match-hero .when{font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;margin-top:2px}
.vs{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,7vw,38px);line-height:1.05;text-transform:uppercase;margin:6px 0;overflow-wrap:anywhere}
.vs .us{color:var(--green-ink)} .vs .sep{color:var(--orange);margin:0 .2em}
.place{font-size:14px;color:var(--muted);margin-top:6px}
.place b{color:var(--ink)}
.mapbtn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--band);color:var(--band-ink);text-decoration:none;font-weight:700;border-radius:10px;padding:8px 14px;font-size:14px}
.mapbtn svg{width:16px;height:16px}
.mapbtn.sm{margin:0;padding:3px 9px;font-size:12px;border-radius:8px}
.mapbtn.sm svg{width:13px;height:13px}
.rec{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:14px}
.rec div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rec b{display:block;font-family:var(--f-display);font-size:24px;color:var(--ink);letter-spacing:0}
@media (max-width:480px){.rec{grid-template-columns:repeat(3,minmax(0,1fr))}}
.game{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.game.past{opacity:.78}
.game.next{border:2px solid var(--orange)}
.game .gt{font-weight:700;overflow-wrap:anywhere}
.game .gt .us,.afine .us{color:var(--green-ink)}
.game .gm{font-size:13px;color:var(--muted);display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;margin-top:2px}
.game .gr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.score{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.pill.home{background:var(--ok-soft);color:var(--green-ink)} .pill.away{background:var(--surface-2);color:var(--muted)}
.pill.win{background:var(--ok-soft);color:var(--green-ink)} .pill.draw{background:var(--orange-soft);color:var(--orange-ink)} .pill.loss{background:var(--danger-soft);color:var(--danger)}
.resin{display:flex;gap:6px;align-items:center}
.resin input{width:60px;padding:6px 8px;text-align:center}

/* scorers */
.game .gs{font-size:13px;color:var(--ink);margin-top:4px;overflow-wrap:anywhere}
.game .gs .muted{color:var(--muted)}
.goled{border-top:1px dashed var(--line);padding:10px 0 12px;display:flex;flex-direction:column;gap:8px}
.goled .gl{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.goled .gl b{font-family:var(--f-display);font-size:18px;color:var(--muted);text-align:center}
@media (max-width:480px){.goled .gl{grid-template-columns:24px minmax(0,1fr)}.goled .gl select:last-child{grid-column:2}}
.lbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:4px}
@media (max-width:700px){.lbs{grid-template-columns:minmax(0,1fr)}}
.lb{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.lb h2{margin:0 0 8px;font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.lb h2 i{width:10px;height:10px;border-radius:50%;background:var(--c);display:block}
.lb.g{--c:var(--green)} .lb.a{--c:var(--orange)}
.lr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.lr:first-of-type{border-top:0}
.lr .rk{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--muted);text-align:center}
.lr.top .rk{color:var(--c)}
.lr .nm{font-weight:700;overflow-wrap:anywhere}
.lr .ct{font-family:var(--f-display);font-weight:800;font-size:22px}
.lr .lbar{grid-column:2/-1;height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.lr .lbar i{display:block;height:100%;background:var(--c)}

/* certificates */
.cstats{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.cstat{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--muted)}
.cstat b{font-family:var(--f-display);font-size:24px;line-height:1;color:var(--ink)}
.cstat i{width:10px;height:10px;border-radius:50%;display:block}
.c-ok{--c:var(--green)} .c-soon{--c:var(--orange)} .c-late{--c:var(--danger)} .c-none{--c:var(--muted)}
.cstat i,.crow .dot{background:var(--c)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 14px}
.crow .cn{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.crow .cd{font-size:13px;color:var(--muted)}
.crow .cbar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.crow .cbar i{display:block;height:100%;background:var(--c)}
.pill.none{background:var(--surface-2);color:var(--muted)}
.cedit{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cedit input[type=date]{width:auto;padding:6px 9px}

.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;margin:20px 0 14px;overflow-x:auto}
.tab{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab.mgmt[aria-selected="true"]{background:var(--orange);color:#1f1200}
@media (max-width:480px){.tabs{flex-wrap:wrap}.tab{flex:1 1 40%;padding:8px 6px;font-size:14px}}

.list{display:flex;flex-direction:column;gap:8px}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prow > button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 14px;cursor:pointer}
.prow > button:focus-visible{outline:3px solid var(--orange);outline-offset:-3px}
.rank{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--muted);text-align:center}
.prow.top .rank{color:var(--orange)}
.pname{display:block;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{display:block;font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);margin-top:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .p{background:var(--green)} .bar .d{background:var(--orange)}
.ptot{text-align:right}
.ptot .v{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1}
.ptot .s{font-size:12.5px;color:var(--orange-ink);font-weight:600}
.ptot .s.ok{color:var(--green-ink)}
.pdetail{border-top:1px solid var(--line);padding:6px 14px 10px;background:var(--surface-2)}
.crown{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--orange-soft);color:var(--orange-ink);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:2px}

.month{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;display:flex;justify-content:space-between;gap:8px}
.month:first-child{margin-top:0}
.fine{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.pdetail .fine{margin-top:6px}
.date{text-align:center;line-height:1.05;border-right:1px solid var(--line);padding-right:10px}
.date .d{font-family:var(--f-display);font-weight:800;font-size:24px}
.date .m{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fbody{min-width:0}
.fwho{font-weight:700}
.fwhy{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.fnote{font-size:12.5px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.fright{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.amount{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--green-ink)}
.pill.due{background:var(--orange-soft);color:var(--orange-ink)}
.pill.late{background:var(--danger-soft);color:var(--danger)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select{min-width:0;flex:1 1 160px}

select,input[type=text],input[type=password],input[type=number],input[type=date]{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
select:focus,input:focus{border-color:var(--green);outline:none}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid .full{grid-column:1/-1}
@media (max-width:600px){.grid{grid-template-columns:minmax(0,1fr)}}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--green);color:var(--on-green)}
.btn.accent{background:var(--orange);color:#1f1200}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.switch{display:flex;flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:14px;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;margin:0;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked{background:var(--green)}
.switch input:checked::after{left:21px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

var ui={section:"home",view:"",admin:false,atab:"nuova",calErr:"",golErr:"",golOpen:null,calEdit:null,calConfirmRm:null,calAll:false,spRename:null,spConfirmRm:null,spErr:"",certErr:"",certConfirmRm:null,fPlayer:"",fStatus:"tutte",open:null,editId:null,confirmDel:null,renameP:null,login:false,loginErr:"",loading:true,loadErr:"",busy:false,toast:"",toastBad:false};

function eur(n){n=Number(n)||0;return n.toLocaleString("it-IT",{style:"currency",currency:"EUR",minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseD(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function fmtD(s){var d=parseD(s);return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear()}

function sortFines(a){return a.slice().sort(function(x,y){return x.date<y.date?1:x.date>y.date?-1:(y.created>x.created?1:-1)})}

/* ---------- data ---------- */
function fromRow(r){return{id:r.id,player:r.giocatore,code:r.articolo,reason:r.motivazione,amount:Number(r.importo),date:r.data,note:r.nota||"",paid:r.saldata,paidDate:r.data_saldo,doubled:r.raddoppiata,created:r.created_at||""}}
function load(){
  if(!sb){ui.loading=false;render();return Promise.resolve()}
  return Promise.all([
    sb.from("giocatori").select("nome").order("nome"),
    sb.from("multe").select("*").order("data",{ascending:false}),
    loadSp(),
    loadCert(),
    loadGare()
  ]).then(function(res){
    if(res[0].error)throw res[0].error;if(res[1].error)throw res[1].error;
    state.players=res[0].data.map(function(r){return r.nome});
    state.fines=res[1].data.map(fromRow);
    ui.loading=false;ui.loadErr="";render();
  }).catch(function(e){ui.loading=false;ui.loadErr=(e&&e.message)||"errore di rete";render()});
}
// locker-room rota: never rejects, so a problem here does not hide the fines
function loadSp(){
  return Promise.all([
    sb.from("spogliatoi_stato").select("coda,assenti").eq("id",1).maybeSingle(),
    sb.from("spogliatoi_storico").select("*").order("id",{ascending:false}).limit(30)
  ]).then(function(res){
    if(res[0].error)throw res[0].error;if(res[1].error)throw res[1].error;
    var r=res[0].data||{};
    state.sp={coda:r.coda||[],assenti:r.assenti||[]};state.spHist=res[1].data||[];ui.spErr="";
  }).catch(function(e){ui.spErr=(e&&e.message)||"errore di rete"});
}
function loadCert(){
  return sb.from("certificati").select("nome,scadenza").order("nome").then(function(r){
    if(r.error)throw r.error;state.cert=r.data||[];ui.certErr="";
  }).catch(function(e){ui.certErr=(e&&e.message)||"errore di rete"});
}
// medical certificate status: expired, expiring within 30 days, valid, or missing
function certStatus(c){
  if(!c.scadenza)return{k:"none",label:"Mancante",txt:"Data non inserita",days:null};
  var d=Math.round((parseD(c.scadenza)-parseD(today()))/864e5);
  if(d<0)return{k:"late",label:"Scaduto",txt:"scaduto da "+(-d)+(d===-1?" giorno":" giorni"),days:d};
  if(d<=30)return{k:"soon",label:"In scadenza",txt:d===0?"scade oggi":"scade tra "+d+(d===1?" giorno":" giorni"),days:d};
  return{k:"ok",label:"Valido",txt:"valido ancora "+d+" giorni",days:d};
}
function certSorted(){
  var rank={late:0,none:1,soon:2,ok:3};
  return state.cert.map(function(c){return{c:c,s:certStatus(c)}}).sort(function(a,b){
    return rank[a.s.k]-rank[b.s.k]||((a.s.days==null?0:a.s.days)-(b.s.days==null?0:b.s.days))||a.c.nome.localeCompare(b.c.nome,"it");
  });
}
function loadGare(){
  return Promise.all([
    sb.from("gare").select("*").order("data").order("ora"),
    sb.from("gol").select("*").order("ordine")
  ]).then(function(res){
    if(res[0].error)throw res[0].error;state.gare=res[0].data||[];ui.calErr="";
    if(res[1].error){state.gol=[];ui.golErr=res[1].error.message||"errore"}else{state.gol=res[1].data||[];ui.golErr=""}
  }).catch(function(e){ui.calErr=(e&&e.message)||"errore di rete"});
}
function golOf(id){return state.gol.filter(function(x){return x.gara_id===id}).sort(function(a,b){return a.ordine-b.ordine})}
function scorersLine(g){
  var gs=golOf(g.id);if(!gs.length)return"";
  // group repeated scorers: "Savino 2 (ass. Di Pinto, Betteri)"
  var by={},order=[],auto=0;
  gs.forEach(function(x){if(!x.marcatore){auto++;return}if(!by[x.marcatore]){by[x.marcatore]={n:0,ass:[]};order.push(x.marcatore)}by[x.marcatore].n++;if(x.assist)by[x.marcatore].ass.push(x.assist)});
  var parts=order.map(function(n){var b=by[n];return'<b>'+esc(n)+'</b>'+(b.n>1?" "+b.n:"")+(b.ass.length?' <span class="muted">(ass. '+b.ass.map(esc).join(", ")+')</span>':'')});
  if(auto)parts.push('<span class="muted">autogol'+(auto>1?" "+auto:"")+'</span>');
  return'<div class="gs">⚽ '+parts.join(", ")+'</div>';
}
function roster(){

}

function certCounts(){var n={ok:0,soon:0,late:0,none:0};state.cert.forEach(function(c){n[certStatus(c).k]++});return n}
// Absent people (in the order they were marked) leave the next pair and slot in right after it:
// the first one marked goes to position 3, the second to position 4, and so on.
// The people behind them move up, so the pair is always the first two of the resulting order.
function spPlan(){
  var coda=state.sp.coda,absent=state.sp.assenti.filter(function(n){return coda.indexOf(n)>=0});
  var base=coda.filter(function(n){return absent.indexOf(n)<0});
  var order=base.slice(0,2).concat(absent,base.slice(2));
  var cur=order.slice(0,2),newCoda=order.slice(2).concat(cur),next=[];
  // simulate the following turns the same way "Pulizia fatta" does (first two go to the back),
  // so with an odd number of people the pairs shift by one each round and nobody cleans alone
  var q=newCoda.slice(),turns=Math.ceil(coda.length/2)-1;
  for(var i=0;i<turns&&q.length>=2;i++){var p=q.slice(0,2);next.push(p);q=q.slice(2).concat(p)}
  return{cur:cur,next:next,newCoda:newCoda,absent:absent,order:order};
}
function spSave(coda,assenti,msg){

// run a write, then reload everything; err messages in Italian
function run(promise,okMsg){
  ui.busy=true;render();
  return promise.then(function(r){
    if(r&&r.error)throw r.error;
    return load().then(function(){ui.busy=false;if(okMsg)toast(okMsg);else render();return true});
  }).catch(function(e){
    ui.busy=false;
    var m=(e&&e.message)||"";
    if(/row-level security|permission|JWT|not authorized/i.test(m))toast("Non hai i permessi per modificare: rifai l’accesso admin.",true);
    else if(/duplicate key/i.test(m))toast("Esiste già un elemento con questo nome.",true);
    else if(/foreign key/i.test(m))toast("Il giocatore ha ancora multe registrate.",true);
    else toast("Operazione non riuscita: "+(m||"errore di rete"),true);
    return false;
  });
}
function ensurePlayer(name){
  if(state.players.indexOf(name)>=0)return Promise.resolve({});
  return sb.from("giocatori").insert({nome:name});
}

function totals(){
  var t={all:0,paid:0,due:0,n:state.fines.length,late:0},byReason={};
  state.fines.forEach(function(f){t.all+=f.amount;if(f.paid)t.paid+=f.amount;else{t.due+=f.amount;if(isLate(f))t.late++}byReason[f.reason]=(byReason[f.reason]||0)+1});
  var top=null;Object.keys(byReason).forEach(function(k){if(!top||byReason[k]>byReason[top])top=k});
  t.topReason=top;t.topReasonN=top?byReason[top]:0;return t;
}
function playerStats(){
  var m={};
  state.players.forEach(function(p){m[p]={name:p,tot:0,paid:0,due:0,n:0,fines:[]}});
  state.fines.forEach(function(f){var p=m[f.player]||(m[f.player]={name:f.player,tot:0,paid:0,due:0,n:0,fines:[]});p.tot+=f.amount;p.n++;if(f.paid)p.paid+=f.amount;else p.due+=f.amount;p.fines.push(f)});
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.tot-a.tot||a.name.localeCompare(b.name,"it")});
}

}
var ICONS={
  multe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>',
  spogliatoi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16"/><path d="M12 3v18M2 21h20M9 11v2M15 11v2"/></svg>',
  calendario:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><circle cx="12" cy="16" r="2.5"/></svg>',
  certificati:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15h6"/></svg>'
};
function viewHome(){
  var wait=ui.loading?"Caricamento…":"";

function calUnavailable(){return'<div class="empty"><strong>Calendario non disponibile</strong>Non riesco a leggere le gare ('+esc(ui.calErr)+').</div>'}

  if(!state.gol.length)return'<div class="empty"><strong>Nessun gol registrato</strong>Le classifiche compaiono quando il capitano inserisce i marcatori delle gare.</div>';
  function board(cls,title,key,unit){
    var rows=leaderboard(key),max=rows.length?rows[0].c:1;
    return'<section class="lb '+cls+'"><h2><i></i>'+title+'</h2>'+(rows.length?rows.map(function(r){

function render(){
  if(ui.view==="gestione"&&!ui.admin)ui.view=SECTIONS[ui.section][0];
  if(ui.section==="account"&&!ui.admin){ui.section="home";ui.view=""}
  var s=ui.section,v=ui.view,mg=v==="gestione",body;
  if(s==="home")body=viewHome();
  else if(s==="multe"&&v==="regolamento")body=viewRules();
  else if((body=statusBox())){}
  else if(s==="multe")body=mg?viewAdmin():v==="cronologia"?viewChrono():viewPlayers();
  else if(s==="spogliatoi")body=mg?adminSp():viewSp();
  else if(s==="certificati")body=mg?adminCert():viewCert();
  else if(s==="calendario")body=mg?adminCal():v==="marcatori"?viewScorers():viewCal();
  else body=adminPassword();
  // keep focus/values of an open form across a toast re-render
  var keep=null,ae=document.activeElement;
  if(ae&&ae.id&&root.contains(ae)&&/INPUT|SELECT/.test(ae.tagName))keep=ae.id;
  var vals={};root.querySelectorAll("form input:not([type=checkbox]),form select").forEach(function(el){if(el.id)vals[el.id]=el.value});
  var formBefore=root.querySelector("form.card");var formId=formBefore&&formBefore.id;
  root.innerHTML=header()+'<main class="wrap'+(s==="home"?" home-main":"")+'">'+(s==="multe"&&!mg?strip()+payBox():'')+(s==="home"?'':tabs())+body+'<footer>ASD GaN Milano'+(s==="multe"?' · Le somme raccolte finanziano solo attività della squadra':'')+'</footer></main>'+loginModal()+(ui.toast?'<div class="toast'+(ui.toastBad?" bad":"")+'" role="status">'+esc(ui.toast)+'</div>':'');
  var formAfter=root.querySelector("form.card");
  if(formAfter&&formAfter.id===formId&&ui.keepForm){Object.keys(vals).forEach(function(id){var el=document.getElementById(id);if(el)el.value=vals[id]})}
  ui.keepForm=false;
  if(ui.login&&!keep){var u=$("#l-user");if(u)u.focus()}
  if(keep){var k=document.getElementById(keep);if(k)k.focus()}
}
var toastT;
function toast(m,bad){ui.toast=m;ui.toastBad=!!bad;ui.keepForm=!!bad;render();clearTimeout(toastT);toastT=setTimeout(function(){ui.toast="";ui.keepForm=true;render()},bad?6000:3500)}

/* ---------- events ---------- */
root.addEventListener("click",function(e){
  if(e.target.closest("a[href]"))return;
  var el=e.target.closest("[data-act]");if(!el||el.disabled)return;
  var a=el.dataset.act,id=el.dataset.id,f=id?state.fines.filter(function(x){return x.id===id})[0]:null;
  if(a==="closeLogin"){if(e.target!==el)return;ui.login=false;ui.loginErr="";render();return}
  switch(a){
    case"go":go(el.dataset.s);break;
    case"view":ui.view=el.dataset.v;ui.open=null;if(ui.view!=="gestione")ls.set("gan-view-"+ui.section,ui.view);render();window.scrollTo({top:0});break;
    case"toggle":ui.open=ui.open===el.dataset.p?null:el.dataset.p;render();break;
    case"reload":ui.loading=true;render();load();break;
    case"openLogin":ui.login=true;ui.loginErr="";render();break;
    case"logout":sb.auth.signOut().finally(function(){ui.admin=false;if(ui.section==="account")go("");else render()});break;
    case"atab":ui.atab=el.dataset.v;if(ui.atab!=="nuova")ui.editId=null;ui.confirmDel=null;ui.renameP=null;render();break;
    case"edit":ui.editId=id;ui.atab="nuova";render();window.scrollTo({top:0});break;
    case"cancelEdit":ui.editId=null;ui.atab="elenco";render();break;
    case"askDel":ui.confirmDel=id;render();break;
    case"noDel":ui.confirmDel=null;render();break;
    case"del":ui.confirmDel=null;run(sb.from("multe").delete().eq("id",id),"Multa eliminata.");break;
    case"paid":if(f)run(sb.from("multe").update({saldata:!f.paid,data_saldo:f.paid?null:today()}).eq("id",id),f.paid?"Segnata come non saldata.":"Multa saldata.");break;
    case"double":if(f&&!f.doubled)run(sb.from("multe").update({importo:f.amount*2,raddoppiata:true}).eq("id",id),"Importo raddoppiato (art. 22).");break;
    case"rename":ui.renameP=el.dataset.p;render();var r=$("#pl-rename");if(r)r.focus();break;
    case"renameNo":ui.renameP=null;render();break;
    case"renameOk":
      var oldN=el.dataset.p,newN=clean($("#pl-rename").value);
      if(!newN||newN===oldN){ui.renameP=null;render();break}
      ui.renameP=null;run(sb.from("giocatori").update({nome:newN}).eq("nome",oldN),"Giocatore rinominato.");break;
    case"rmPl":run(sb.from("giocatori").delete().eq("nome",el.dataset.p),"Giocatore rimosso.");break;
    case"spDone":
      var pl=spPlan();if(!pl.cur.length)break;
      run(sb.rpc("spogliatoi_fatto",{p_puliti:pl.cur,p_assenti:pl.absent,p_coda:pl.newCoda}),"Pulizia registrata: "+pl.cur.join(" & ")+".");break;
    case"spUndo":run(sb.rpc("spogliatoi_annulla"),"Ultima pulizia annullata.");break;
    case"spAbs":
      var nA=el.dataset.p,asA=state.sp.assenti.slice(),iA=asA.indexOf(nA);
      if(iA>=0)asA.splice(iA,1);else asA.push(nA);
      spSave(state.sp.coda,asA,iA>=0?nA+" segnato presente.":nA+" segnato assente.");break;
    case"spUp":case"spDown":
      var cM=state.sp.coda.slice(),iM=cM.indexOf(el.dataset.p),jM=a==="spUp"?iM-1:iM+1;
      if(iM<0||jM<0||jM>=cM.length)break;
      var tM=cM[iM];cM[iM]=cM[jM];cM[jM]=tM;spSave(cM,state.sp.assenti);break;
    case"spRename":ui.spRename=el.dataset.p;ui.spConfirmRm=null;render();var sr=$("#sp-rename");if(sr)sr.focus();break;
    case"spRenameNo":ui.spRename=null;render();break;
    case"spRenameOk":
      var oS=el.dataset.p,nS=clean($("#sp-rename").value);ui.spRename=null;
      if(!nS||nS===oS){render();break}
      if(state.sp.coda.indexOf(nS)>=0){toast("C’è già qualcuno con questo nome nella fila.",true);break}
      spSave(state.sp.coda.map(function(x){return x===oS?nS:x}),state.sp.assenti.map(function(x){return x===oS?nS:x}),"Nome aggiornato.");break;
    case"spAskRm":ui.spConfirmRm=el.dataset.p;render();break;
    case"spRmNo":ui.spConfirmRm=null;render();break;
    case"spRm":
      var nR=el.dataset.p;ui.spConfirmRm=null;
      spSave(state.sp.coda.filter(function(x){return x!==nR}),state.sp.assenti.filter(function(x){return x!==nR}),nR+" tolto dalla fila.");break;
    case"golOpen":ui.golOpen=ui.golOpen===el.dataset.id?null:el.dataset.id;render();break;
    case"golClose":ui.golOpen=null;render();break;
    case"golSave":
      var gG=state.gare.filter(function(x){return x.id===el.dataset.id})[0];if(!gG)break;
      var list=[],ge=$("#gol-err"),bad="";
      for(var gi=0;gi<gG.gol_gan;gi++){
        var mk=$("#gm-"+gi).value,as=$("#ga-"+gi).value;
        if(!mk){bad="Scegli il marcatore del gol "+(gi+1)+" (o “Autogol avversario”).";break}
        if(mk!=="__auto"&&as===mk){bad="Nel gol "+(gi+1)+" marcatore e assist sono la stessa persona.";break}
        list.push({marcatore:mk==="__auto"?null:mk,assist:as||null});
      }
      if(bad){ge.textContent=bad;ge.hidden=false;break}
      run(sb.rpc("salva_gol",{p_gara:gG.id,p_gol:list}),"Marcatori salvati.").then(function(ok){if(ok){ui.golOpen=null;render()}});break;
    case"calEdit":ui.calEdit=el.dataset.id;ui.calConfirmRm=null;render();window.scrollTo({top:0});break;
    case"calCancel":ui.calEdit=null;render();break;
    case"calAskRm":ui.calConfirmRm=el.dataset.id;render();break;
    case"calRmNo":ui.calConfirmRm=null;render();break;
    case"calRm":var gR=el.dataset.id;ui.calConfirmRm=null;if(ui.calEdit===gR)ui.calEdit=null;run(sb.from("gare").delete().eq("id",gR),"Gara eliminata.");break;
    case"resSave":
      var gid=el.dataset.id,gS=state.gare.filter(function(x){return x.id===gid})[0],rgv=$("#rg-"+gid).value,rav=$("#ra-"+gid).value;
      if((rgv==="")!==(rav==="")){toast("Inserisci entrambi i gol, oppure svuota tutti e due i campi.",true);break}
      var rg=rgv===""?null:parseInt(rgv,10),ra=rav===""?null:parseInt(rav,10);
      if((rg!=null&&!(rg>=0))||(ra!=null&&!(ra>=0))){toast("I gol devono essere numeri da 0 in su.",true);break}
      run(sb.from("gare").update({gol_gan:rg,gol_avv:ra}).eq("id",gid),rg==null?"Risultato tolto.":"Risultato salvato: "+matchTitle(gS).replace(/<[^>]+>/g,"")+" "+scoreText({casa:gS.casa,gol_gan:rg,gol_avv:ra})+".");break;
    case"certAskRm":ui.certConfirmRm=el.dataset.p;render();break;
    case"certRmNo":ui.certConfirmRm=null;render();break;
    case"certRm":var nC=el.dataset.p;ui.certConfirmRm=null;run(sb.from("certificati").delete().eq("nome",nC),nC+" tolto dai certificati.");break;
  }
});
root.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="cal-all"){ui.calAll=t.checked;render();return}
  if(t.id==="c-avv"||t.id==="c-casa"){
    // fill field and address: our ground when at home, otherwise the opponent's ground from earlier games
    var atHome=$("#c-casa").value==="1",opp=clean($("#c-avv").value),src=null;
    state.gare.forEach(function(g){if(atHome?g.casa:(!g.casa&&g.avversario===opp))src=g});
    if(src){$("#c-campo").value=src.campo||"";$("#c-ind").value=src.indirizzo||"";$("#c-note").value=atHome?"":(src.note||"")}
    var withCol=state.gare.filter(function(g){return g.avversario===opp&&g.colori_avv})[0];if(withCol&&!$("#c-col").value)$("#c-col").value=withCol.colori_avv;
    return;
  }
  if(t.dataset&&t.dataset.cert!=null){
    var cn=t.dataset.cert,cv=t.value||null;
    run(sb.from("certificati").update({scadenza:cv,updated_at:new Date().toISOString()}).eq("nome",cn),cv?"Scadenza di "+cn+" salvata: "+fmtD(cv)+".":"Data di "+cn+" tolta.");
  }
  else if(t.id==="f-player"){ui.fPlayer=t.value;render()}
  else if(t.id==="f-status"){ui.fStatus=t.value;render()}
  else if(t.id==="f-pl"){var w=$("#f-newpl-wrap");w.hidden=t.value!=="__new";if(!w.hidden)$("#f-newpl").focus()}
  else if(t.id==="f-rule"){
    $("#f-custom-wrap").hidden=t.value!=="altro";
    var r=RULES.filter(function(x){return String(x.c)===t.value})[0];
    if(r)$("#f-amount").value=r.a;else $("#f-custom").focus();
  }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&ui.login){ui.login=false;render();return}
  // keyboard access for the home tiles
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("tile")){e.preventDefault();e.target.click()}
});
root.addEventListener("submit",function(e){
  e.preventDefault();var id=e.target.id;
  if(id==="login-form"){
    var u=clean($("#l-user").value).toLowerCase(),p=$("#l-pw").value;
    var email=u.indexOf("@")>=0?u:u+"@"+(CFG.ADMIN_DOMAIN||"multegan.app");
    ui.busy=true;ui.loginErr="";render();
    sb.auth.signInWithPassword({email:email,password:p}).then(function(r){
      ui.busy=false;
      if(r.error){ui.loginErr=/invalid/i.test(r.error.message)?"Nome utente o password non corretti.":"Accesso non riuscito: "+r.error.message;render();return}
      ui.admin=true;ui.login=false;if(ui.section!=="home"&&ui.section!=="account")ui.view="gestione";render();
    });
  }
  else if(id==="fine-form"){
    var err=$("#f-err");var fail=function(m){err.textContent=m;err.hidden=false};
    var pl=$("#f-pl").value,isNew=pl==="__new";
    if(isNew){pl=clean($("#f-newpl").value);if(!pl)return fail("Scrivi il nome del nuovo giocatore.")}
    if(!pl)return fail("Scegli un giocatore.");
    var rv=$("#f-rule").value,code=null,reason;
    if(rv==="altro"){reason=clean($("#f-custom").value);if(!reason)return fail("Scrivi la motivazione.")}
    else{var r=RULES.filter(function(x){return String(x.c)===rv})[0];if(!r)return fail("Scegli una motivazione.");code=r.c;reason=r.t}
    var amt=parseFloat($("#f-amount").value);if(!(amt>=0.25))return fail("L’importo minimo è 0,25 €.");
    var date=$("#f-date").value||today(),paid=$("#f-paid").checked,note=clean($("#f-note").value)||null;
    var row={giocatore:pl,articolo:code,motivazione:reason,importo:amt,data:date,nota:note,saldata:paid};
    var editId=ui.editId;
    if(editId){
      var old=state.fines.filter(function(x){return x.id===editId})[0];
      row.data_saldo=paid?(old&&old.paid?old.paidDate:today()):null;
      run(ensurePlayer(pl).then(function(r){if(r&&r.error)throw r.error;return sb.from("multe").update(row).eq("id",editId)}),"Multa aggiornata.").then(function(ok){if(ok){ui.editId=null;ui.atab="elenco";render()}});
    }else{
      row.data_saldo=paid?today():null;
      run(ensurePlayer(pl).then(function(r){if(r&&r.error)throw r.error;return sb.from("multe").insert(row)}),"Multa aggiunta a "+pl+".");
    }
  }
  else if(id==="pl-form"){
    var n=clean($("#pl-new").value);if(!n)return;
    if(state.players.indexOf(n)>=0){toast("Questo giocatore è già in rosa.",true);return}
    run(sb.from("giocatori").insert({nome:n}),n+" aggiunto alla rosa.");
  }
  else if(id==="cal-form"){
    var fe=$("#c-ferr"),fail2=function(m){fe.textContent=m;fe.hidden=false};
    var row={avversario:clean($("#c-avv").value),casa:$("#c-casa").value==="1",data:$("#c-data").value,ora:$("#c-ora").value||"21:30",fase:$("#c-fase").value,
      giornata:$("#c-giornata").value?parseInt($("#c-giornata").value,10):null,campo:clean($("#c-campo").value)||null,indirizzo:clean($("#c-ind").value)||null,
      colori_avv:clean($("#c-col").value)||null,note:clean($("#c-note").value)||null};
    if(!row.avversario)return fail2("Scrivi il nome della squadra avversaria.");
    if(!row.data)return fail2("Scegli la data della gara.");
    var editG=ui.calEdit;
    if(editG)run(sb.from("gare").update(row).eq("id",editG),"Gara aggiornata.").then(function(ok){if(ok){ui.calEdit=null;render()}});
    else run(sb.from("gare").insert(row),"Gara aggiunta: "+fmtD(row.data)+".");
  }
  else if(id==="cert-form"){
    var cN=clean($("#cert-new").value),cD=$("#cert-new-date").value||null;if(!cN)return;
    if(state.cert.some(function(c){return c.nome===cN})){toast("C’è già un giocatore con questo nome.",true);return}
    run(sb.from("certificati").insert({nome:cN,scadenza:cD}),cN+" aggiunto ai certificati.");
  }
  else if(id==="sp-form"){
    var nN=clean($("#sp-new").value);if(!nN)return;
    if(state.sp.coda.indexOf(nN)>=0){toast("C’è già qualcuno con questo nome nella fila.",true);return}
    spSave(state.sp.coda.concat([nN]),state.sp.assenti,nN+" aggiunto in fondo alla fila.");
  }
  else if(id==="pw-form"){
    var p1=$("#c-pw").value,p2=$("#c-pw2").value,ce=$("#c-err");
    if(p1.length<8){ce.textContent="La password deve avere almeno 8 caratteri.";ce.hidden=false;return}
    if(p1!==p2){ce.textContent="Le due password non coincidono.";ce.hidden=false;return}
    ui.busy=true;render();
    sb.auth.updateUser({password:p1}).then(function(r){ui.busy=false;if(r.error)toast("Password non aggiornata: "+r.error.message,true);else toast("Password aggiornata.")});
  }
});

/* ---------- start ---------- */
if("serviceWorker" in navigator&&location.protocol!=="file:"){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
window.addEventListener("hashchange",function(){readHash();render();window.scrollTo({top:0})});
render();
if(sb){
  sb.auth.getSession().then(function(r){if(r.data&&r.data.session){ui.admin=true;render()}});
  sb.auth.onAuthStateChange(function(ev,session){var was=ui.admin;ui.admin=!!session;if(was!==ui.admin){if(location.hash==="#account")readHash();render()}});
  load();
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&!ui.busy)load()});
}
})();
</script>
</body>
</html>
